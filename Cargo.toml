[package]
name = "formulary"
version = "0.3.0"
edition = "2021"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
description = "Native MathML Core layout: OpenType MATH metrics in, resolution-independent display list out"
keywords = ["mathml", "math", "layout", "typesetting"]
categories = ["mathematics", "text-processing"]
readme = "README.md"
documentation = "https://docs.rs/formulary"
repository = "https://github.com/ophymx/formulary"
# The vendored STIX Two Math font stays in the package: it keeps the crate
# self-testable and feeds the future bundled-font feature.
exclude = ["third_party"]

[dependencies]
roxmltree = "0.21"
# read-fonts is the one font parser: skrifa (metrics, outlines) and harfrust
# (shaping) both sit on it, so every table is parsed exactly once. Pinned to
# the minor harfrust depends on so the tree carries a single copy.
read-fonts = "0.43.3"
skrifa = { version = "0.46", default-features = false, features = ["std"] }
harfrust = { version = "0.13", optional = true }

[features]
default = ["svg", "shaping"]
# SVG emission (debugging window and golden-test format). Core stays display-list only.
svg = []
# Text shaping via harfrust: kerning in multi-character token runs and the
# `ssty` script-alternates feature. Without it, glyphs are placed by plain
# cmap lookup + advances (correct for isolated math glyphs).
shaping = ["dep:harfrust"]
